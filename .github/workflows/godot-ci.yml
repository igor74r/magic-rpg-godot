name: Godot CI

# Keep only the newest validation run for each branch; stale queued runs waste runner capacity.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate native Godot project
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Import and validate project resources
        run: godot --headless --path . --editor --quit

      - name: Test save repository contract
        run: godot --headless --path . --script res://tests/godot/save_repository_test.gd

      - name: Test canonical world graph
        run: godot --headless --path . --script res://tests/godot/world_graph_test.gd

      - name: Test deterministic world random contract
        run: godot --headless --path . --script res://tests/godot/world_random_test.gd

      - name: Test campaign mission and story-region progression
        run: godot --headless --path . --script res://tests/godot/world_campaign_engine_test.gd

      - name: Test playable Rift progression
        run: godot --headless --path . --script res://tests/godot/world_rift_engine_test.gd

      - name: Test daily quest progress and rewards
        run: godot --headless --path . --script res://tests/godot/world_daily_quest_engine_test.gd

      - name: Test Tower of Trials progression
        run: godot --headless --path . --script res://tests/godot/world_tower_engine_test.gd

      - name: Test NPC crafting, rarity and transaction safety
        run: godot --headless --path . --script res://tests/godot/world_npc_engine_test.gd

      - name: Test story dragon finale rewards
        run: godot --headless --path . --script res://tests/godot/world_combat_engine_test.gd

      - name: Test atomic world repository and interrupted-write recovery
        run: godot --headless --path . --script res://tests/godot/world_state_repository_test.gd

      - name: Test save-scoped world exploration state
        run: godot --headless --path . --script res://tests/godot/world_state_test.gd

      - name: Test deterministic overworld map generation
        run: godot --headless --path . --script res://tests/godot/world_map_generator_test.gd

      - name: Test authored region encounter catalog
        run: godot --headless --path . --script res://tests/godot/world_region_catalog_test.gd

      - name: Test deterministic region encounter generation
        run: godot --headless --path . --script res://tests/godot/world_encounter_generator_test.gd

      - name: Test native turn-based combat loop
        run: godot --headless --path . --script res://tests/godot/world_combat_engine_test.gd

      - name: Test class abilities and spells
        run: godot --headless --path . --script res://tests/godot/world_combat_engine_test.gd

      - name: Test native inventory and equipment
        run: godot --headless --path . --script res://tests/godot/world_combat_engine_test.gd

      - name: Boot the main scene
        run: godot --headless --path . --quit-after 2
