name: Complete browser baseline import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-browser-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current browser repository
        uses: actions/checkout@v4
        with:
          repository: igor74r/magic-rpg
          ref: main
          path: source

      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          path: destination

      - name: Add files missing from destination
        run: rsync -a --ignore-existing --exclude='.git/' source/ destination/

      - name: Commit imported files
        working-directory: destination
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No missing files to import."
            exit 0
          fi
          git commit -m "Complete import from browser game repository"
          git push
